<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Splat Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Relative paths, so the site also works under https://<user>.github.io/<repo>/ -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="status" id="status">
    <div id="status-text">Loading…</div>
    <div class="progress"><span id="bar"></span></div>
  </div>
  <button id="tilt" class="tilt" type="button" hidden aria-label="Tilt with phone gyro" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
    </svg>
  </button>
  <div class="hint">Drag to orbit · scroll or pinch to zoom · right-drag or two fingers to pan</div>
  <script src="js/viewer.js" type="module"></script>
</body>
</html>
